name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: Core test suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Portable bash runner: same tests, sources, and flags as the PowerShell
      # script (g++ -std=c++17 -Wall -Wextra -Werror), no .exe suffixes.
      - name: Run core verifiers (Linux)
        if: runner.os == 'Linux'
        run: ./tools/run-core-tests.sh

      - name: Set up MSYS2 (MinGW-w64 g++)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Run core verifiers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          g++ --version
          .\tools\run-core-tests.ps1

      # Wall-clock thresholds are noisy on shared windows-latest runners, so
      # this gate is informational: it still surfaces checksum/operations drift
      # in the logs without blocking the build on benchmark-runner jitter.
      - name: Benchmark regression gate (check-core-performance-regression.ps1)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          g++ --version
          .\tools\check-core-performance-regression.ps1

      - name: Release readiness gate (check-release-readiness.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tools\check-release-readiness.ps1

  desktop-host:
    name: Desktop host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install SDL3 (Windows, pinned mingw devel)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tools\setup-desktop-deps.ps1

      - name: Install SDL3 (Linux, pinned source build)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libxfixes-dev libxrender-dev libwayland-dev libxkbcommon-dev
          SDL_VERSION=3.4.18
          curl -sL -o /tmp/sdl3.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz"
          tar -xzf /tmp/sdl3.tar.gz -C /tmp
          cmake -S /tmp/SDL3-${SDL_VERSION} -B /tmp/sdl3-build -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF
          cmake --build /tmp/sdl3-build -j
          sudo cmake --install /tmp/sdl3-build

      - name: Configure (Windows MinGW)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          cmake -S . -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD\external\SDL3\x86_64-w64-mingw32"

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build/desktop -DCMAKE_BUILD_TYPE=Release

      - name: Build gba-desktop
        run: cmake --build build/desktop --config Release

      # Headless lab smoke without proprietary ROMs: a synthetic fixture is
      # generated in the script (zeroed content, valid header, never committed).
      - name: Headless lab smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tools\run-desktop-smoke.ps1

      - name: Headless lab smoke (Linux)
        if: runner.os == 'Linux'
        run: ./tools/run-desktop-smoke.sh

      # Cartridge-save lifecycle: restart persistence, reset preservation,
      # no spurious empty saves, rejected-save preservation.
      - name: Save-lifecycle smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          .\tools\run-desktop-save-smoke.ps1

      - name: Save-lifecycle smoke (Linux)
        if: runner.os == 'Linux'
        run: ./tools/run-desktop-save-smoke.sh

      # Drives the interactive SDL host with dummy video/audio drivers and
      # asserts a real (nonuniform) window was presented.
      - name: Interactive host smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          .\tools\run-desktop-interactive-smoke.ps1

      - name: Interactive host smoke (Linux)
        if: runner.os == 'Linux'
        run: ./tools/run-desktop-interactive-smoke.sh

      # Portable Windows ZIP (exe + verified runtime DLLs + licenses). Built
      # as a CI artifact only; no release is published from CI.
      - name: Package portable Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          .\tools\package-windows-portable.ps1

      - name: Upload portable Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gba-desktop-windows-x64
          path: dist/gba-desktop-*-windows-x64.zip
          if-no-files-found: error

