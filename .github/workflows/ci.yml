name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: Core test suite (run-core-tests.ps1)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSYS2 (MinGW-w64 g++)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Run core verifiers
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          g++ --version
          .\tools\run-core-tests.ps1
